<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auth</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial;
            padding: 20px;
        }
        .box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background: #ff8c42;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🔧 Test de Autenticación</h1>

    <div class="box">
        <h2>SessionStorage</h2>
        <p id="sessionInfo">Cargando...</p>
        <button onclick="setTestSession()">Crear sesión de prueba</button>
        <button onclick="clearSession()">Limpiar sesión</button>
    </div>

    <div class="box">
        <h2>Redirección Manual</h2>
        <button onclick="goToDashboardCamarero()">Ir a Dashboard Camarero</button>
        <button onclick="goToDashboardGerente()">Ir a Dashboard Gerente</button>
        <button onclick="goToDashboardDueno()">Ir a Dashboard Dueño</button>
    </div>

    <div class="box">
        <h2>Rutas</h2>
        <p>Rutas probadas:</p>
        <ul>
            <li>dashboard-camarero.html</li>
            <li>./dashboard-camarero.html</li>
            <li>/app-restaurante/dashboard-camarero.html</li>
        </ul>
    </div>

    <script src="auth.js"></script>
    <script>
        function updateInfo() {
            const user = Auth.getUser();
            document.getElementById('sessionInfo').innerHTML =
                '<pre>' + JSON.stringify(user, null, 2) + '</pre>';
        }

        function setTestSession() {
            const r = Auth.login('camarero1', '1234', false);
            updateInfo();
            alert(r.ok ? '✅ Sesión de prueba creada' : '❌ ' + r.error);
        }

        function clearSession() {
            sessionStorage.clear();
            localStorage.removeItem('restaurante-auth');
            updateInfo();
            alert('✅ Sesión limpiada');
        }

        function goToDashboardCamarero() {
            console.log('Intentando ir a dashboard-camarero.html');
            window.location.href = 'dashboard-camarero.html';
        }

        function goToDashboardGerente() {
            console.log('Intentando ir a dashboard-gerente.html');
            window.location.href = 'dashboard-gerente.html';
        }

        function goToDashboardDueno() {
            console.log('Intentando ir a dashboard-dueno.html');
            window.location.href = 'dashboard-dueno.html';
        }

        updateInfo();
    </script>
</body>
</html>
