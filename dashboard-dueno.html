<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dueño - App Restaurante</title>
    <link rel="stylesheet" href="styles-dashboard-camarero.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="header-left">
                <h1>👑 Dashboard Dueño</h1>
                <p class="user-info">💼 <strong id="camareroNombre">Dueño</strong></p>
            </div>
            <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
        </div>

        <div class="dashboard-content" style="grid-template-columns: 1fr;">
            <div class="mesas-section">
                <h2>Panel de Control Empresarial</h2>
                <p style="color: #aaa; margin-top: 20px;">
                    ✅ Análisis de ventas<br>
                    ✅ Gestión de personal<br>
                    ✅ Reportes financieros<br>
                    ✅ Configuración del restaurante<br>
                    ✅ Estadísticas por horario<br>
                    <em style="color: #666; margin-top: 20px; display: block;">Próximamente...</em>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Dashboard Dueño Cargado');

            // Verificar autenticación
            const isAuth = sessionStorage.getItem('staff_authenticated') === 'true';
            const role = sessionStorage.getItem('staff_role');
            const name = sessionStorage.getItem('staff_name');

            console.log('Autenticado:', isAuth, 'Rol:', role, 'Nombre:', name);

            if (!isAuth || role !== 'dueno') {
                console.log('No autorizado, redirigiendo a login');
                window.location.href = './login-camareros.html';
                return;
            }

            if (name) {
                document.getElementById('camareroNombre').textContent = name;
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                console.log('Logout');
                sessionStorage.clear();
                localStorage.removeItem('staff_user');
                window.location.href = './login-camareros.html';
            });
        });
    </script>
</body>
</html>
