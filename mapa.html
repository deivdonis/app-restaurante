<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12100e">
    <title>Mapa de Mesas - Personal</title>
    <link rel="stylesheet" href="styles-mapa.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="auth.js"></script>
    <script src="firebase-config.js"></script>
    <script src="notificaciones.js"></script>
    <script src="sync.js"></script>
    <script>
        // Solo camareros: sin sesión va al login, otro rol va a su propio panel
        Auth.requireRole('camarero');
    </script>
</head>
<body>
    <!-- Barra de personal (solo camareros autenticados) -->
    <header class="staff-bar">
        <a href="dashboard-camarero.html" class="staff-back">‹ Dashboard</a>
        <button class="staff-notif" id="notifBtn" type="button">🔔 Avisos</button>
        <button class="staff-logout" id="logoutBtn" type="button">Cerrar sesión</button>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="mapa-section">
                <div class="header">
                    <h1>Mapa de Mesas</h1>
                    <p class="subtitle">Haz clic para asignar o liberar una mesa</p>
                    <div class="camarero-info">
                        <span>👨‍💼 Camarero: <strong id="camareroNombre">Cargando...</strong></span>
                    </div>
                    <div class="mapa-legend">
                        <span class="legend-item"><i class="dot free"></i>Libre</span>
                        <span class="legend-item"><i class="dot occupied"></i>Ocupada</span>
                        <span class="legend-item"><i class="dot assigned"></i>Mía</span>
                    </div>
                </div>

                <div class="mesas-grid" id="mesasGrid">
                    <!-- Las mesas se generarán con JavaScript -->
                </div>
            </div>

            <!-- Panel de Mensajes -->
            <div class="messages-panel">
                <div class="messages-header">
                    <h2>📬 Mensajes</h2>
                    <button class="clear-messages-btn" id="clearMessagesBtn">Limpiar</button>
                </div>

                <div class="messages-list" id="messagesList">
                    <p class="no-messages">No hay mensajes</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script-mapa.js"></script>
</body>
</html>
