<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12100e">
    <title>Acceso Personal - App Restaurante</title>
    <link rel="stylesheet" href="styles-login.css">
</head>
<body>
    <a href="index.html" class="back-link">‹ Volver a la app</a>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">👨‍💼</div>
            <h1>Acceso Personal</h1>
            <p class="subtitle">Camareros · Gerencia · Dirección</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="tu.usuario"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Recuérdame en este dispositivo</label>
                </div>

                <button type="submit" class="btn-login">
                    Iniciar sesión
                </button>
            </form>

            <div class="login-message" id="loginMessage"></div>

            <div class="help-section">
                <p>¿Problemas para acceder?</p>
                <a href="#" class="help-link">Contacta al administrador</a>
            </div>
        </div>

        <div class="demo-credentials">
            <p class="demo-title">🔑 Credenciales de prueba <span>(pulsa para rellenar)</span></p>

            <button type="button" class="demo-user" data-user="camarero1" data-pass="1234">
                <span class="demo-role">👨‍🍳 Camarero</span>
                <span class="demo-creds">camarero1 · 1234</span>
                <span class="demo-dest">Mapa y mesas</span>
            </button>

            <button type="button" class="demo-user" data-user="gerente" data-pass="gerente123">
                <span class="demo-role">👔 Gerente</span>
                <span class="demo-creds">gerente · gerente123</span>
                <span class="demo-dest">Panel de gerencia</span>
            </button>

            <button type="button" class="demo-user" data-user="dueno" data-pass="dueno123">
                <span class="demo-role">👑 Dueño</span>
                <span class="demo-creds">dueno · dueno123</span>
                <span class="demo-dest">Panel de dirección</span>
            </button>

            <p class="demo-note">camarero1 … camarero5, todos con contraseña 1234</p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script-login.js"></script>
</body>
</html>
