<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerente - App Restaurante</title>
    <link rel="stylesheet" href="styles-dashboard-camarero.css">
    <script src="auth.js"></script>
    <script>
        // Solo gerencia: sin sesión va al login, otro rol va a su propio panel
        Auth.requireRole('gerente');
    </script>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="header-left">
                <h1>📊 Dashboard Gerente</h1>
                <p class="user-info">👔 <strong id="camareroNombre">Gerente</strong></p>
            </div>
            <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
        </div>

        <div class="dashboard-content" style="grid-template-columns: 1fr;">
            <div class="mesas-section">
                <h2>Funcionalidades del Gerente</h2>
                <p style="color: #aaa; margin-top: 20px;">
                    ✅ Ver reportes de mesas<br>
                    ✅ Supervisar camareros<br>
                    ✅ Gestionar horarios<br>
                    ✅ Ver estadísticas<br>
                    <em style="color: #666; margin-top: 20px; display: block;">Próximamente...</em>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.requireRole('gerente');
            if (!user) return;

            document.getElementById('camareroNombre').textContent = user.name;
            document.getElementById('logoutBtn').addEventListener('click', () => Auth.logout());
        });
    </script>
</body>
</html>
